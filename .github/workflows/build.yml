name: build

on:
  push:
    branches: [main, jdk25-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        java: ['25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Smoke test
        shell: pwsh
        run: ./smoke.ps1
      - name: Guard - no JDK internal APIs
        shell: bash
        run: |
          out=$(jdeps --jdk-internals target/legacy-order-service-*.jar)
          echo "$out"
          if echo "$out" | grep -q "JDK internal API"; then exit 1; fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: target/surefire-reports

  container:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package
        run: mvn -B -ntp -DskipTests package
      - name: Build image
        run: docker build -t legacy-order-service:ci .
      - name: Run image and check output
        run: |
          docker run --rm legacy-order-service:ci | tee container-output.txt
          grep -q "Done." container-output.txt
      - name: Image size
        run: docker image ls legacy-order-service:ci

  next-jdk:
    name: early warning (JDK 27, not blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test on the next JDK
        run: mvn -B -ntp clean verify
