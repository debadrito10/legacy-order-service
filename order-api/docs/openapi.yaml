openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
paths:
  /orders:
    get:
      tags:
      - order-controller
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
    post:
      tags:
      - order-controller
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /orders/{id}/actions/{action}:
    post:
      tags:
      - order-controller
      operationId: act
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum:
          - PAY
          - SHIP
          - CANCEL
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /orders/{id}:
    get:
      tags:
      - order-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
components:
  schemas:
    CreateOrderRequest:
      type: object
      properties:
        customer:
          type: string
          maxLength: 100
          minLength: 0
        amountPaise:
          type: integer
          format: int64
          exclusiveMinimum: 0
          maximum: 100000000
      required:
      - customer
    OrderResponse:
      type: object
      properties:
        id:
          type: string
        customer:
          type: string
        amountPaise:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum:
          - NEW
          - PAID
          - SHIPPED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
    PageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
