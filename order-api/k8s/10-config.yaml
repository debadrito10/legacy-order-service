apiVersion: v1
kind: ConfigMap
metadata:
  name: order-api-config
  namespace: noduco-orders
data:
  NODUCO_ORDERS_CURRENCY: INR
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,mongo
---
apiVersion: v1
kind: Secret
metadata:
  name: order-api-secret
  namespace: noduco-orders
type: Opaque
stringData:
  SPRING_MONGODB_URI: mongodb://mongo:27017/orders
