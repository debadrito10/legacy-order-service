apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: noduco-orders
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: order-api:m13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
          envFrom:
            - configMapRef:
                name: order-api-config
            - secretRef:
                name: order-api-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 18080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: noduco-orders
spec:
  selector:
    app: api
  ports:
    - port: 18080
      targetPort: 18080
