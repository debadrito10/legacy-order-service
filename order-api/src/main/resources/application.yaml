spring:
  application:
    name: order-api
  mongodb:
    uri: "mongodb://127.0.0.1:27018/orders-m7?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000"
  data:
    mongodb:
      auto-index-creation: true
server:
  port: 18080
noduco:
  orders:
    currency: INR
  gst:
    base-url: http://localhost:18090
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
